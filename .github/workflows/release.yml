name: Rust release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Package the versioned executable
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, shutil, subprocess, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          manifest = tomllib.loads(pathlib.Path("herdr-plugin.toml").read_text())
          if version != manifest["version"]:
              raise SystemExit("Cargo and plugin manifest versions must match")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match the plugin version")
          target = os.environ["TARGET"]
          suffix = ".exe" if os.name == "nt" else ""
          binary = pathlib.Path("target", target, "release", "herdr-sbx" + suffix)
          subprocess.run([binary, "--version"], check=True)
          dest = pathlib.Path("dist", f"herdr-sbx-v{version}-{target}{suffix}")
          dest.parent.mkdir()
          shutil.copyfile(binary, dest)
          pathlib.Path(str(dest) + ".sha256").write_bytes(hashlib.sha256(dest.read_bytes()).hexdigest().encode() + b"\n")
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
